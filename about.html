  @font-face { font-family: "Barun"; src: url("assets/nbg-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }
  :root { --ink:#0A0A0A; --line:#262626; --text:#F3F1EC; --text-2:#A8A59E; --text-3:#6E6B66; --accent:#E04A4C; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--ink); color:var(--text); font-family:"Helvetica Neue",Helvetica,Arial,"Barun","Malgun Gothic",sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased; }
  .shell { max-width:68rem; margin:0 auto; padding:0 1.15rem 6rem; }
  @media (min-width:48rem) { .shell { padding:0 2.5rem 6rem; } }
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:1.3rem 0 1.1rem; border-bottom:1px solid var(--line); }
  .topbar-brand { display:flex; align-items:center; gap:.6rem; text-decoration:none; color:var(--text); }
  .topbar-brand .sq { display:grid; place-items:center; width:2.3rem; height:2.3rem; background:#C62A2D; color:#fff; font-size:.6rem; font-weight:700; letter-spacing:.04em; }
  .topbar-brand .bn { font-size:.95rem; font-weight:700; letter-spacing:.01em; white-space:nowrap; }
  @media (max-width:47.99rem) { .topbar-brand .bn { font-size:.8rem; } }
  .topbar-nav { display:flex; gap:1.4rem; list-style:none; margin:0; padding:0; }
  .topbar-nav a { font-size:.82rem; font-weight:700; letter-spacing:.02em; color:var(--text-2); text-decoration:none; }
  .topbar-nav a:hover { color:var(--text); }
  .topbar-nav a.on { color:var(--accent); }
  h1 { font-size:clamp(1.7rem,6vw,2.5rem); letter-spacing:-.035em; margin:2.6rem 0 .6rem; }
  .soon { font-size:.8rem; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--accent); }
  p { color:var(--text-2); }
  .dock { position:fixed; left:0; right:0; bottom:0; z-index:40; pointer-events:none; display:flex; justify-content:center; align-items:center; padding:.7rem 0; background:rgba(10,10,10,.96); border-top:1px solid var(--line); }
  .dock img { display:block; height:1.25rem; width:auto; opacity:.92; }
  @media (min-width:48rem) { .dock img { height:1.5rem; } }
  @media (max-width:47.99rem) { .dock { padding:.55rem 0; } .dock img { height:1.05rem; } }
